.speedLine3D{display:flex;align-items:center;gap:6px;position:relative}
#speedUnitBtn{width:auto;margin:0;padding:2px 7px;background:#000;color:#fff;border:1px solid #666;border-radius:5px;font-size:12px;cursor:pointer}

</head>

<body>
<div id="loadingScreen">
  <div class="loadingTitle">Cargando modo...</div>
  <div id="loadingBar"><div id="loadingBarFill"></div></div>
  <div id="loadingPercent">0%</div>
</div>

<canvas id="canvas"></canvas>
<div id="panel">

<label>Velocidad de simulación: <span id="speedLabel">1×</span></label>

      <button data-unit="c">c</button>

  </div>
  <div id="distanceRow3D">📏 Distancia: <b id="distance3DValue">0 UA</b>
    <button id="resetDistance3D" title="Reiniciar distancia" type="button">↺</button>

  </div>
</div>

</div>
<div id="planetMenu">

</div>

<button id="settingsBtn" title="Configuración">⚙️</button>

<script>
// © Sistema Solar — código protegido. Prohibida su modificación o
// redistribución sin autorización. Código de autorización: Beluga
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
let simDays=0,last=performance.now(),paused=false;
let panX=0,panY=0,dragging=false,lastX=0,lastY=0,selectedPlanet=null;
let lastFollowX=0,lastFollowY=0;
let planetHitboxes=[];

// Cada luna: [nombre, distancia orbital (UA), período orbital real (días)]
const bodies=[
 {name:'Mercurio',a:.387,period:87.97,orbitInc:.034,orbitNode:.1,color:'#aaa',size:3,moons:[]},
 {name:'Venus',a:.723,period:224.70,orbitInc:.059,orbitNode:1.1,color:'#d9a35c',size:4,moons:[]},
 {name:'Tierra',a:1,period:365.25,orbitInc:0.00005,orbitNode:2.0,color:'#4d9cff',size:4.5,moons:[['Luna',.00257,27.32]]},

 {name:'Júpiter',a:5.203,period:4332.59,orbitInc:.0226,orbitNode:2.6,color:'#d6b58e',size:7,moons:[
   ['Metis',.000855,.295],

   ['Nix',.0003255,24.85],
   ['Cerbero',.0003864,32.17],
   ['Hidra',.0004328,38.2]
 ]}
];

let showPlanetNames=true, showMoonNames=true, hideOrbits=false, showAsteroids=true, realSizes=true, showMoons=true;
let gameMode='normal';
// Estado del contador de distancia 3D. Se declara al principio del script para que
// cualquier cambio de modo pueda consultarlo sin depender del orden de inicialización.
let distanceTracking3D=false;
let distanceUnit3D='au';
let distanceTravelledAU=0;
let distanceResetTimer3D=null;
const KM_PER_AU_DISTANCE=149597870.7;
const KM_PER_LY=9.460730472e12;


let camYaw=-0.65, camPitch=0.42, camDistance=650, camRoll=0;
// --- Sistema de velocidad de simulación (modo 3D), calcado del de
// Universe/Universal Sandbox: -----------------------------------------
// · Solo hay UNA unidad elegible: la del tiempo SIMULADO. El denominador
//   siempre es "por segundo real" (nunca se cambia); así funciona el
//   original, no con dos unidades independientes.
// · La lista de unidades es exactamente la suya: ms, seg, min, h, día,
//   mes, año, M año (millón de años) y G año (mil millones de años),
//   con año=365.25 días y mes=año/12, igual que en su wiki oficial.
// · El número es un campo de texto editable donde, como en el juego
//   real, puedes escribir solo un número (usa la unidad activa) o un
//   número con su unidad pegada o separada (p. ej. "45min", "2 h",
//   "10d", "1año"): el propio texto cambia la unidad activa.
let speedTimeUnit='day';
const DAY_IN_YEARS=1/365.25;
const SPEED_UNIT_FACTORS={ // cuántas unidades de "simUnit" hay en 1 día
  ms:86400000, sec:86400, min:1440, hour:24, day:1,
  month:12*DAY_IN_YEARS, year:DAY_IN_YEARS,
  Myear:DAY_IN_YEARS/1e6, Gyear:DAY_IN_YEARS/1e9
};
const SPEED_UNIT_LABELS={ms:'ms',sec:'seg',min:'min',hour:'h',day:'día',month:'mes',year:'año',Myear:'M año',Gyear:'G año'};
// Alias reconocidos al escribir la unidad a mano junto al número (en
// español e inglés, como acepta el juego real).
const SPEED_UNIT_ALIASES={
  ms:'ms',milisegundo:'ms',milisegundos:'ms',millisecond:'ms',milliseconds:'ms',
  s:'sec',seg:'sec',segundo:'sec',segundos:'sec',sec:'sec',secs:'sec',second:'sec',seconds:'sec',

function orbitPoint3(radius,angle,inc,node){
  const x=Math.cos(angle)*radius, y=Math.sin(angle)*radius*Math.sin(inc), z=Math.sin(angle)*radius*Math.cos(inc);

function moonWorldPos3D(parent,moon,mi){
  const AU3=180;

  const inc=parent.orbitInc||0;
  const pp=orbitPoint3(parent.a*AU3,pa,inc,parent.orbitNode||0);
  const orbitR=Math.max(parent.a*0.0008*AU3,(moon[1]*AU3)*1.7);
  const ma=(simDays/moon[2])*Math.PI*2+mi*1.3;

// Calcula el zoom necesario para que, al seguir un planeta, su radio dibujado
// ocupe aproximadamente 1/3 de la pantalla (diámetro ≈ min(W,H)/3).
function zoomForPlanetSize(name){
  const targetRadiusPx=(Math.min(W,H)/6)*(name==='Saturno'?1.12:1);
  if(gameMode==='normal'){
    const b=bodies.find(x=>x.name===name);
    const base=b?(b.a<=1.524?Math.max(b.size,5.5):b.size):5.5;
    const sq=Math.max(0,(targetRadiusPx/base-1)/0.12);
    return Math.max(0.005,Math.min(1100,sq*sq));
  }
  const radiusEarth=PLANET_REAL_RADIUS_EARTH[name]||1;
  // En modo real el planeta se dibuja con la misma escala física que las
  // órbitas: radio terrestre -> UA -> píxeles. Por eso el zoom de seguimiento
  // debe calcularse con ESA escala, no con REAL_SIZE_FACTOR, que era la escala
  // visual antigua. Así, al pulsar un planeta, la cámara se acerca lo suficiente
  // para que el planeta ocupe aproximadamente 1/3 de la pantalla.
  const physicalRadiusPx=radiusEarth*EARTH_RADIUS_AU*baseScale();
  const z=targetRadiusPx/Math.max(physicalRadiusPx,1e-9);
  return Math.max(0.005,Math.min(1000,z));
}
// Manchas solares girando: unas pocas manchas fijas en "longitud" que se
// desplazan por el disco según simDays, dando la sensación de que el Sol
// rota sobre su propio eje (periodo ~27 días, similar al real).
// Cada mancha se coloca sobre una esfera de verdad (X, Y, Z), se achata en la
// dirección al centro del disco (perspectiva) y todo se recorta al círculo
// del Sol, así que ninguna mancha puede quedar nunca fuera de él.
function drawSunSpots(cx,cy,radius){
  if(radius<4) return; // demasiado pequeño para distinguir manchas
  const rot=(simDays/27)*Math.PI*2;
  const spots=[
    {lon:0.3, lat:0.15, size:0.16},
    {lon:2.1, lat:-0.25, size:0.11},
    {lon:3.6, lat:0.05, size:0.13},
    {lon:5.0, lat:-0.1, size:0.09},
  ];
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,radius*0.97,0,Math.PI*2);ctx.clip();
  for(const sp of spots){
    const lon=sp.lon+rot;
    const cl=Math.cos(sp.lat);
    const X=Math.sin(lon)*cl, Y=Math.sin(sp.lat), Z=Math.cos(lon)*cl; // Z = hacia el observador
    if(Z<=0.08) continue; // cara oculta del Sol
    const x=cx+X*radius, y=cy-Y*radius;
    const rr=Math.max(0.5,radius*sp.size*1.8);
    const fade=Math.min(1,Z/0.35); // se desvanecen al acercarse al borde
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(Math.atan2(-Y,X));
    ctx.scale(Z,1);
    const g=ctx.createRadialGradient(0,0,0,0,0,rr);
    g.addColorStop(0,`rgba(70,30,8,${(0.75*fade).toFixed(3)})`);
    g.addColorStop(.5,`rgba(140,60,15,${(0.4*fade).toFixed(3)})`);
    g.addColorStop(1,'rgba(140,60,15,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(0,0,rr,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---- Texturas realistas de los planetas -----------------------------
// Cada planeta se dibuja una sola vez sobre un pequeño canvas oculto
// (textura procedural: bandas para los gigantes gaseosos, cráteres para
// los rocosos, continentes para la Tierra, nubes para Venus) y luego esa
// textura se reutiliza como imagen en cada fotograma con drawImage +
// recorte circular, en vez de recalcular el detalle cada vez. Encima se
// pinta el mismo tipo de iluminación (brillo arriba-izquierda, sombra
// hacia el borde) que ya usa el Sol, para que sigan pareciendo esferas.
const planetTextures={};
function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(ch=>ch+ch).join('');
  const n=parseInt(hex,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function shadeRgb(rgb,amt){ // amt>0 aclara, amt<0 oscurece
  return amt>=0 ? rgb.map(c=>c+(255-c)*amt) : rgb.map(c=>c*(1+amt));
}
function rgbCss(rgb,a=1){return `rgba(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0},${a})`;}
function makeLcg(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

function buildBandedTexture(baseColor,size,seed,opts={}){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), base=hexToRgb(baseColor), rnd=makeLcg(seed);
  tctx.fillStyle=rgbCss(base); tctx.fillRect(0,0,size,size);
  const bands=opts.bands||14;
  for(let i=0;i<bands;i++){
    const y0=(i/bands)*size, h=size/bands+1;
    tctx.fillStyle=rgbCss(shadeRgb(base,(rnd()-0.5)*(opts.contrast||0.2)),0.9);
    tctx.fillRect(0,y0,size,h);
  }
  for(let i=0;i<bands*2;i++){
    tctx.fillStyle=rgbCss(shadeRgb(base,(rnd()-0.5)*0.12),0.3);
    tctx.fillRect(0,rnd()*size,size,2+rnd()*4);
  }
  if(opts.spot){
    const sx=size*0.6, sy=size*0.4, srx=size*0.11, sry=size*0.065;
    const g=tctx.createRadialGradient(sx,sy,0,sx,sy,srx);
    g.addColorStop(0,'rgba(195,85,55,0.85)'); g.addColorStop(1,'rgba(195,85,55,0)');
    tctx.fillStyle=g; tctx.beginPath(); tctx.ellipse(sx,sy,srx,sry,0,0,Math.PI*2); tctx.fill();
  }
  return c;
}
function buildCrateredTexture(baseColor,size,seed,craterCount){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), base=hexToRgb(baseColor), rnd=makeLcg(seed);
  tctx.fillStyle=rgbCss(base); tctx.fillRect(0,0,size,size);
  // Los círculos se pintan también desplazados ±size en horizontal para que,
  // al hacer scroll horizontal (rotación del planeta/luna), la textura
  // enlace sin costura por el borde izquierdo/derecho (la superficie es una
  // franja de 360° de longitud enrollada sobre sí misma).
  for(let i=0;i<40;i++){
    const x=rnd()*size,y=rnd()*size,r=size*(0.04+rnd()*0.10);
    tctx.fillStyle=rgbCss(shadeRgb(base,(rnd()-0.5)*0.16),0.5);
    tctx.beginPath();tctx.arc(x-size,y,r,0,Math.PI*2);tctx.arc(x,y,r,0,Math.PI*2);tctx.arc(x+size,y,r,0,Math.PI*2);tctx.fill();
  }
  for(let i=0;i<craterCount;i++){
    const x=rnd()*size,y=rnd()*size,r=size*(0.02+rnd()*0.07);
    tctx.fillStyle=rgbCss(shadeRgb(base,-0.35),0.55);
    tctx.beginPath();
    tctx.arc(x+r*0.15-size,y+r*0.15,r,0,Math.PI*2);
    tctx.arc(x+r*0.15,y+r*0.15,r,0,Math.PI*2);
    tctx.arc(x+r*0.15+size,y+r*0.15,r,0,Math.PI*2);
    tctx.fill();
    tctx.fillStyle=rgbCss(shadeRgb(base,0.25),0.5);
    tctx.beginPath();
    tctx.arc(x-r*0.1-size,y-r*0.1,r*0.8,0,Math.PI*2);
    tctx.arc(x-r*0.1,y-r*0.1,r*0.8,0,Math.PI*2);
    tctx.arc(x-r*0.1+size,y-r*0.1,r*0.8,0,Math.PI*2);
    tctx.fill();
  }
  return c;
}
function buildEarthTexture(size,seed){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), rnd=makeLcg(seed);
  tctx.fillStyle=rgbCss([34,88,188]); tctx.fillRect(0,0,size,size);
  const landTones=[[63,120,60],[110,140,70],[150,120,80]];
  for(let i=0;i<9;i++){
    const cx=rnd()*size, cy=size*0.18+rnd()*size*0.64;
    const rx=size*(0.08+rnd()*0.14), ry=size*(0.05+rnd()*0.09);
    tctx.fillStyle=rgbCss(landTones[i%landTones.length],0.92);
    tctx.beginPath();tctx.ellipse(cx,cy,rx,ry,rnd()*Math.PI,0,Math.PI*2);tctx.fill();
    for(let k=0;k<3;k++){
      tctx.beginPath();
      tctx.ellipse(cx+(rnd()-0.5)*rx*1.4, cy+(rnd()-0.5)*ry*1.4, rx*0.5, ry*0.5, rnd()*Math.PI,0,Math.PI*2);
      tctx.fill();
    }
  }
  for(let i=0;i<16;i++){
    const cx=rnd()*size, cy=rnd()*size, rx=size*(0.05+rnd()*0.09);
    tctx.fillStyle='rgba(255,255,255,0.25)';
    tctx.beginPath();tctx.ellipse(cx,cy,rx,rx*0.4,rnd()*Math.PI,0,Math.PI*2);tctx.fill();
  }
  tctx.fillStyle='rgba(255,255,255,0.9)';
  tctx.fillRect(0,0,size,size*0.07); tctx.fillRect(0,size*0.93,size,size*0.07);
  return c;
}
function buildCloudyTexture(baseColor,size,seed){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), base=hexToRgb(baseColor), rnd=makeLcg(seed);
  tctx.fillStyle=rgbCss(base); tctx.fillRect(0,0,size,size);
  for(let i=0;i<26;i++){
    const y=rnd()*size, h=size*(0.02+rnd()*0.05);
    tctx.fillStyle=rgbCss(shadeRgb(base,(rnd()-0.5)*0.2),0.5);
    tctx.beginPath();
    tctx.ellipse(size*0.5+(rnd()-0.5)*size*0.6, y, size*(0.35+rnd()*0.25), h, 0,0,Math.PI*2);
    tctx.fill();
  }
  return c;
}
function getPlanetTexture(body){
  if(planetTextures[body.name]) return planetTextures[body.name];
  const size=160, seed=[...body.name].reduce((a,ch)=>a+ch.charCodeAt(0),0)*7919+13;
  let tex;
  switch(body.name){
    case 'Júpiter': tex=buildBandedTexture(body.color,size,seed,{bands:16,contrast:0.26,spot:true}); break;
    case 'Saturno': tex=buildBandedTexture(body.color,size,seed,{bands:12,contrast:0.16}); break;
    case 'Urano':   tex=buildBandedTexture(body.color,size,seed,{bands:8,contrast:0.08}); break;
    case 'Neptuno': tex=buildBandedTexture(body.color,size,seed,{bands:9,contrast:0.11}); break;
    case 'Tierra':  tex=buildEarthTexture(size,seed); break;
    case 'Venus':   tex=buildCloudyTexture(body.color,size,seed); break;
    case 'Marte':   tex=buildCrateredTexture(body.color,size,seed,18); break;
    case 'Mercurio':tex=buildCrateredTexture(body.color,size,seed,30); break;
    case 'Plutón':  tex=buildCrateredTexture(body.color,size,seed,20); break;
    default:        tex=buildCrateredTexture(body.color,size,seed,15);
  }
  planetTextures[body.name]=tex;
  return tex;
}
// Sustituye al círculo plano de un color: recorta la textura del planeta
// en un círculo y le aplica la misma iluminación de esfera que el Sol.
// No cambia tamaños ni posiciones, solo cómo se pinta ese círculo.
// Antes el giro se hacía con ctx.rotate(), que gira la textura entera como
// una rueda/moneda sobre el plano de la pantalla. Así NO se ve una esfera
// rotando: una esfera vista de perfil (que es como se ve casi siempre un
// planeta) muestra su superficie DESLIZÁNDOSE de lado a lado, no girando
// como un plato. Por eso "no giraban bien". Esto lo arregla: la textura se
// pinta como un patrón que se repite horizontalmente (un planeta es una
// franja de 360° de longitud enrollada), y se desplaza en horizontal según
// el ángulo de rotación, dando el efecto correcto de rotación axial.
// ---- Rotación manual del planeta (modo 3D) -----------------------------
// Clic derecho (o Mayús + clic) y arrastrar sobre el planeta seguido: lo gira
// sobre sí mismo en horizontal (para ver la cara de atrás) y en vertical
// (para ver los polos). En modo 3D la textura se proyecta sobre una esfera real.
let sunDirView3D=null; // dirección planeta→Sol en el espacio de la cámara (solo modo 3D)
let skipShade=false;
const userRot={}; // nombre del cuerpo -> {lon,lat} (radianes)
let planetDrag3D=false;
const texPixCache=new WeakMap();
let sphereBuf=null;
function drawTexturedSphere(x,y,r,tex,spinAngle,name){
  let td=texPixCache.get(tex);
  if(!td){ td=tex.getContext('2d').getImageData(0,0,tex.width,tex.height); texPixCache.set(tex,td); }
  const ur=userRot[name]||{lon:0,lat:0};
  const N=Math.max(2,Math.min(220,Math.ceil(r*2)));
  if(!sphereBuf) sphereBuf=document.createElement('canvas');
  if(sphereBuf.width!==N||sphereBuf.height!==N){ sphereBuf.width=N; sphereBuf.height=N; }
  const bctx=sphereBuf.getContext('2d');
  const img=bctx.createImageData(N,N), out=img.data, src=td.data, tw=td.width, th=td.height;
  const cl=Math.cos(ur.lat), sl=Math.sin(ur.lat), TAU=Math.PI*2;
  const uOff=spinAngle/TAU-ur.lon/TAU+0.5;
  const sd=sunDirView3D;
  for(let j=0;j<N;j++){
    const py=1-(j+.5)/N*2;
    for(let i=0;i<N;i++){
      const px=(i+.5)/N*2-1, d2=px*px+py*py;
      if(d2>1) continue;
      const pz=Math.sqrt(1-d2);
      const yb=py*cl+pz*sl, zb=-py*sl+pz*cl;
      const lat=Math.asin(yb>1?1:(yb<-1?-1:yb));
      let u=uOff+Math.atan2(px,zb)/TAU; u-=Math.floor(u);
      const ty=Math.min(th-1,Math.max(0,((.5-lat/Math.PI)*th)|0));
      const tx=Math.min(tw-1,(u*tw)|0);
      const k=(ty*tw+tx)*4, o=(j*N+i)*4;
      let br=1;
      if(sd){ const l=px*sd[0]+py*sd[1]+pz*sd[2]; br=0.05+0.95*Math.max(0,Math.min(1,l*1.1)); }
      out[o]=src[k]*br; out[o+1]=src[k+1]*br; out[o+2]=src[k+2]*br; out[o+3]=255;
    }
  }
  bctx.putImageData(img,0,0);
  ctx.drawImage(sphereBuf,x-r,y-r,r*2,r*2);
  skipShade=!!sd; // con luz real se omite el degradado falso de los dibujos
}
function drawRotatingTexture(x,y,r,tex,spinAngle,name){
  skipShade=false;
  if(gameMode==='3d' && name){ try{ drawTexturedSphere(x,y,r,tex,spinAngle,name); return; }catch(e){} }
  const texW=tex.width, texH=tex.height;
  const scale=(r*2)/texH;
  const scaledW=texW*scale;
  let offset=((spinAngle/(Math.PI*2))*scaledW)%scaledW;
  if(offset<0) offset+=scaledW;
  const pattern=ctx.createPattern(tex,'repeat-x');
  pattern.setTransform(new DOMMatrix().translate(x-r-offset,y-r).scale(scale,scale));
  ctx.fillStyle=pattern;
  ctx.fillRect(x-r,y-r,r*2,r*2);
}
function drawPlanetSphere(x,y,r,body,spinAngle=0){
  if(r<0.6){ ctx.fillStyle=body.color; ctx.beginPath();ctx.arc(x,y,Math.max(1,r),0,Math.PI*2);ctx.fill(); return; }
  const tex=getPlanetTexture(body);
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  drawRotatingTexture(x,y,r,tex,spinAngle,body.name);
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,0.35)');
  g.addColorStop(.35,'rgba(255,255,255,0)');
  g.addColorStop(.75,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=skipShade?'rgba(0,0,0,0)':g;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// Mismo enfoque que los planetas: una textura procedural por luna, cacheada,
// pero con estilos propios de luna (cráteres densos, hielo agrietado,
// vulcanismo, neblina o dos caras muy distintas) según lo que se conoce de
// cada una, en vez del círculo gris liso de antes.
const MOON_VISUALS={

  'Jápeto':{type:'twoTone',color:'#3f3a34',color2:'#d9d6cc'},
  'Febe':{type:'cratered',color:'#55504a',craters:14},
  'Miranda':{type:'cratered',color:'#c4c2bb',craters:18},
  'Ariel':{type:'cratered',color:'#cdd0d2',craters:16},
  'Umbriel':{type:'cratered',color:'#726f6c',craters:14},
  'Titania':{type:'cratered',color:'#b7b3ad',craters:14},
  'Oberón':{type:'cratered',color:'#a39d95',craters:16},

  'Cerbero':{type:'cratered',color:'#b0aca3',craters:6},
  'Hidra':{type:'cratered',color:'#b0aca3',craters:6}
};
function buildIcyTexture(baseColor,size,seed){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), base=hexToRgb(baseColor), rnd=makeLcg(seed);
  tctx.fillStyle=rgbCss(base); tctx.fillRect(0,0,size,size);
  // Manchas suaves de hielo más claro/oscuro, sin cráteres marcados.
  for(let i=0;i<10;i++){
    const x=rnd()*size,y=rnd()*size,r=size*(0.08+rnd()*0.16);
    tctx.fillStyle=rgbCss(shadeRgb(base,(rnd()-0.5)*0.14),0.35);
    tctx.beginPath();tctx.arc(x,y,r,0,Math.PI*2);tctx.fill();
  }
  // Grietas: líneas finas que cruzan la superficie (tipo Europa/Encélado).
  const lines=6+Math.floor(rnd()*5);
  for(let i=0;i<lines;i++){
    let x=rnd()*size,y=rnd()*size;
    const ang=rnd()*Math.PI*2, len=size*(0.4+rnd()*0.5), seg=10;
    tctx.strokeStyle=rgbCss(shadeRgb(base,rnd()>0.5?0.3:-0.28),0.55);
    tctx.lineWidth=Math.max(1,size*0.006);
    tctx.beginPath();tctx.moveTo(x,y);
    let a=ang;
    for(let s=0;s<seg;s++){
      a+=(rnd()-0.5)*0.6;
      x+=Math.cos(a)*len/seg; y+=Math.sin(a)*len/seg;
      tctx.lineTo(x,y);
    }
    tctx.stroke();
  }
  return c;
}
function buildVolcanicTexture(baseColor,size,seed){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), base=hexToRgb(baseColor), rnd=makeLcg(seed);
  tctx.fillStyle=rgbCss(base); tctx.fillRect(0,0,size,size);
  // Manchado general tipo azufre.
  for(let i=0;i<22;i++){
    const x=rnd()*size,y=rnd()*size,r=size*(0.05+rnd()*0.10);
    tctx.fillStyle=rgbCss(shadeRgb(base,(rnd()-0.5)*0.3),0.5);
    tctx.beginPath();tctx.arc(x,y,r,0,Math.PI*2);tctx.fill();
  }
  // Puntos volcánicos activos: núcleo oscuro con halo naranja/rojo (calderas
  // y plumas, como Ío).
  const spots=5+Math.floor(rnd()*4);
  for(let i=0;i<spots;i++){
    const sx=rnd()*size, sy=rnd()*size, sr=size*(0.05+rnd()*0.09);
    const g=tctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    g.addColorStop(0,'rgba(80,20,10,0.9)');
    g.addColorStop(.4,'rgba(220,90,30,0.75)');
    g.addColorStop(1,'rgba(220,90,30,0)');
    tctx.fillStyle=g; tctx.beginPath();tctx.arc(sx,sy,sr,0,Math.PI*2);tctx.fill();
  }
  return c;
}
function buildTwoToneTexture(darkColor,lightColor,size,seed){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const tctx=c.getContext('2d'), rnd=makeLcg(seed);
  const dark=hexToRgb(darkColor), light=hexToRgb(lightColor);
  // Franja PERIÓDICA en vez de un degradado de un solo tramo: la cara
  // oscura y la clara ocupan cada una medio giro (180°), y al llegar al
  // borde derecho se vuelve a la oscura igual que en el izquierdo, así al
  // desplazar la textura en horizontal (rotación) enlaza sin costura.
  const img=tctx.createImageData(size,1);
  for(let x=0;x<size;x++){
    const t=(Math.cos((x/size)*Math.PI*2)+1)/2; // 1 en el centro claro, 0 en los extremos oscuros
    const px=(i)=>Math.round(dark[i]+(light[i]-dark[i])*t);
    img.data[x*4]=px(0); img.data[x*4+1]=px(1); img.data[x*4+2]=px(2); img.data[x*4+3]=255;
  }
  const rowCanvas=document.createElement('canvas'); rowCanvas.width=size; rowCanvas.height=1;
  rowCanvas.getContext('2d').putImageData(img,0,0);
  tctx.drawImage(rowCanvas,0,0,size,size);
  for(let i=0;i<14;i++){
    const x=rnd()*size,y=rnd()*size,r=size*(0.02+rnd()*0.05);
    const t=(Math.cos((x/size)*Math.PI*2)+1)/2;
    const base=t>0.5?light:dark;
    tctx.fillStyle=rgbCss(shadeRgb(base,-0.3),0.4);
    tctx.beginPath();tctx.arc(x-size,y,r,0,Math.PI*2);tctx.arc(x,y,r,0,Math.PI*2);tctx.arc(x+size,y,r,0,Math.PI*2);tctx.fill();
  }
  return c;
}
const moonTextures={};
function getMoonTexture(name){
  if(moonTextures[name]) return moonTextures[name];
  const vis=MOON_VISUALS[name]||{type:'cratered',color:'#b0aca3',craters:12};
  const size=96, seed=[...name].reduce((a,ch)=>a+ch.charCodeAt(0),0)*7919+31;
  let tex;
  switch(vis.type){
    case 'icy':     tex=buildIcyTexture(vis.color,size,seed); break;
    case 'volcanic':tex=buildVolcanicTexture(vis.color,size,seed); break;
    case 'twoTone': tex=buildTwoToneTexture(vis.color,vis.color2,size,seed); break;
    default:        tex=buildCrateredTexture(vis.color,size,seed,vis.craters||12);
  }
  moonTextures[name]=tex;
  return tex;
}
// Igual que drawPlanetSphere pero para lunas: recorta su textura propia en
// un círculo y le aplica la misma iluminación de esfera. Con radios muy
// pequeños (lunas lejanas o menores) cae al círculo plano de antes, ya que
// a esos tamaños la textura no se apreciaría de todos modos.
function drawMoonSphere(x,y,r,name,spinAngle=0){
  const vis=MOON_VISUALS[name];
  const baseColor=vis?vis.color:'#ddd';
  if(r<1.1){ shadeSphere3D(x,y,r,baseColor,1); return; }
  const tex=getMoonTexture(name);
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  drawRotatingTexture(x,y,r,tex,spinAngle,name);
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,0.3)');
  g.addColorStop(.35,'rgba(255,255,255,0)');
  g.addColorStop(.75,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=skipShade?'rgba(0,0,0,0)':g;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// Dibuja el cielo (estrellas + Vía Láctea) en el contexto indicado. Es una
// función aparte para poder pintarla en un canvas oculto (caché) y no tener
// que recalcular miles de puntos y decenas de degradados en cada fotograma.
function renderSkyLayer(targetCtx, yaw, pitch, w, h, focalLen, twinkleT){
  targetCtx.clearRect(0,0,w,h);
  const skyCosY=Math.cos(yaw),skySinY=Math.sin(yaw);
  const skyCosP=Math.cos(pitch),skySinP=Math.sin(pitch);
  function projectSky(dx,dy,dz){
    let x=dx*skyCosY-dz*skySinY;
    let z=dx*skySinY+dz*skyCosY;
    let y=dy*skyCosP-z*skySinP;
    z=dy*skySinP+z*skyCosP;
    if(z<=0.035)return null;
    return {x:w/2+(x/z)*focalLen,y:h/2-(y/z)*focalLen};
  }
  // Estrellas generales (más densidad, brillo y un ligero centelleo).
  let seed=24680;
  for(let i=0;i<1500;i++){
    seed=(seed*1664525+1013904223)>>>0; const u=seed/4294967296;
    seed=(seed*1664525+1013904223)>>>0; const v=seed/4294967296;
    seed=(seed*1664525+1013904223)>>>0; const wv=seed/4294967296;
    const lon=u*Math.PI*2, lat=Math.asin(v*2-1);
    const cl=Math.cos(lat), dx=cl*Math.cos(lon), dy=Math.sin(lat), dz=cl*Math.sin(lon);
    const sp=projectSky(dx,dy,dz); if(!sp)continue;
    const r=(i%41===0)?1.9:(i%11===0?1.3:(i%3===0?0.9:0.6));
    // Centelleo suave y determinista por estrella, distinto para cada una.
    const tw=0.65+0.35*Math.sin(twinkleT*(1.5+wv*2.5)+i);
    const tint=i%23===0?'255,225,180':(i%17===0?'190,210,255':(i%13===0?'255,255,255':'210,220,235'));
    targetCtx.fillStyle=`rgba(${tint},${(0.55+0.45*tw).toFixed(2)})`;
    targetCtx.fillRect(sp.x,sp.y,r,r);
  }
  // Vía Láctea — capa 1: resplandor difuso continuo (manchas de nube grandes
  // y muy transparentes) para que la banda no se vea como puntos sueltos
  // sino como una bruma luminosa, tal y como se ve a simple vista.
  seed=445566;
  for(let i=45;i<90;i++){
    seed=(seed*1664525+1013904223)>>>0; const u=seed/4294967296;
    seed=(seed*1664525+1013904223)>>>0; const v=seed/4294967296;
    const lon=u*Math.PI*2;
    const lat=(v-.5)*0.30+Math.sin(lon*3.0)*0.03;
    const cl=Math.cos(lat), dx=cl*Math.cos(lon), dy=Math.sin(lat), dz=cl*Math.sin(lon);
    const sp=projectSky(dx,dy,dz); if(!sp)continue;
    const coreBoost=Math.max(0,1-Math.abs(((lon+Math.PI)%(Math.PI*2))-Math.PI)/0.9);
    const blobR=130+coreBoost*110;
    const g=targetCtx.createRadialGradient(sp.x,sp.y,0,sp.x,sp.y,blobR);
    const a=0.15+coreBoost*0.18;
    g.addColorStop(0,`rgba(225,233,252,${a.toFixed(3)})`);
    g.addColorStop(1,'rgba(215,225,248,0)');
    targetCtx.fillStyle=g;
    targetCtx.beginPath();targetCtx.arc(sp.x,sp.y,blobR,0,Math.PI*2);targetCtx.fill();
  }
  // Vía Láctea — capa 2: puntos con núcleo más brillante y textura
  // irregular, encima del resplandor. Su plano celeste está inclinado
  // y gira con la cámara.
  seed=918273;
  for(let i=0;i<2200;i++){
    seed=(seed*1664525+1013904223)>>>0; const u=seed/4294967296;
    seed=(seed*1664525+1013904223)>>>0; const v=seed/4294967296;
    const lon=u*Math.PI*2;
    // Concentración fuerte alrededor del plano galáctico, con textura irregular.
    const spread=(v-.5)*0.42 + Math.sin(lon*3.0)*0.035 + Math.sin(lon*9.0)*0.018;
    const lat=spread;
    const cl=Math.cos(lat), dx=cl*Math.cos(lon), dy=Math.sin(lat), dz=cl*Math.sin(lon);
    const sp=projectSky(dx,dy,dz); if(!sp)continue;
    // Núcleo galáctico: la zona cercana a lon≈0 se ve más densa y brillante.
    const coreBoost=Math.max(0,1-Math.abs(((lon+Math.PI)%(Math.PI*2))-Math.PI)/0.9);
    const r=(i%23===0?1.6:(i%7===0?1.1:0.6))*(1+coreBoost*0.6);
    const baseAlpha=(i%11===0)?0.56:0.34;
    const alpha=Math.min(1,baseAlpha+coreBoost*0.45);
    targetCtx.fillStyle=(i%11===0)?`rgba(255,238,200,${alpha.toFixed(2)})`:`rgba(222,228,245,${alpha.toFixed(2)})`;
    targetCtx.fillRect(sp.x,sp.y,r,r);
  }
}

// Formatea la velocidad de la cámara 3D (dada en UA/s) según la unidad
// elegida por el usuario en el desplegable.
function formatCamSpeed(auPerSec){
  const KM_PER_AU=149597870.7;
  const C_KMS=299792.458; // velocidad de la luz, km/s
  const kms=auPerSec*KM_PER_AU;
  if(speedUnit==='kms') return kms.toFixed(1)+' km/s';
  if(speedUnit==='pct') return (kms/C_KMS*100).toFixed(5)+' % de c';
  if(speedUnit==='c') return (kms/C_KMS).toFixed(1)+'c';
  return auPerSec.toFixed(3)+' UA/s';
}

function drawInterstellarSystemMarkers(project){
  starSystemHitboxes.length=0;
  if(gameMode!=='3d') return;

  const distSunLY=Math.hypot(camTargetX,camTargetY,camTargetZ)/(AU_UNIT*LY_IN_AU);

  // Cuando estamos a escala interestelar, el Sistema Solar deja de verse
  // como planetas individuales y pasa a ser un único punto navegable.
  if(distSunLY>=INTERSTELLAR_MARKER_LY){
    const p=project(0,0,0);
    if(p.depth>0){
      const r=9;
      ctx.fillStyle='rgba(255,210,80,.20)';ctx.beginPath();ctx.arc(p.x,p.y,r*2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd35a';ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.fillText('Sistema Solar',p.x+r+7,p.y-3);
      ctx.fillStyle='#aaa';ctx.font='11px Arial';ctx.fillText('0 a.l.',p.x+r+7,p.y+12);
      starSystemHitboxes.push({id:'sun',x:p.x,y:p.y,radius:Math.max(14,r+5)});
    }
  }


}


function draw3D(){
  const now=performance.now();
  const dt=Math.min((now-last)/1000,0.1);
  last=now;
  const simSpeed=simSpeed3D;
  if(!paused) simDays += dt*simSpeed;

  // Red de seguridad: si algún cálculo produjera NaN/Infinity (p. ej. un
  // evento de zoom llegando en un instante con el canvas a tamaño 0), la
  // cámara se quedaría "congelada" para siempre. Mejor autocorregir aquí
  // que dejar que el problema persista sin explicación aparente.
  if(!Number.isFinite(camTargetX)||!Number.isFinite(camTargetY)||!Number.isFinite(camTargetZ)){
    camTargetX=0;camTargetY=0;camTargetZ=0;
  }
  if(!Number.isFinite(camDistance)||camDistance<=0){
    camDistance=650;
  }
  if(!Number.isFinite(velX3D)) velX3D=0;
  if(!Number.isFinite(velY3D)) velY3D=0;
  if(!Number.isFinite(velZ3D)) velZ3D=0;

  // Movimiento suave con las flechas. Se mueve respecto a la orientación de
  // la cámara. Usamos una VELOCIDAD persistente (velX3D/velZ3D) que se
  // suaviza hacia la velocidad objetivo y luego se integra con dt una sola
  // vez — así el desplazamiento total por segundo no depende del framerate.
  // (Antes se mezclaban dos factores de dt en la misma fórmula, lo que
  // hacía que la velocidad real cambiara si el framerate variaba durante
  // la sesión: "al principio va bien y luego va mal".)
  // Velocidad fijada con las teclas numéricas 1-9 y 0 (ver keydown más abajo).
  const moveSpeed=AU_UNIT*(adminArrowSpeedAU!==null?adminArrowSpeedAU:moveSpeedLevel);
  const smoothing=1-Math.exp(-dt*9);
  // OJO con los signos: deben coincidir exactamente con la rotación que usa
  // project() (yaw luego pitch) o "adelante" acaba apuntando a otro lado
  // según el ángulo de la cámara. Con yaw=0 y pitch=0 la cámara mira hacia
  // -Z, así que "adelante" es (-sin(yaw)*cos(pitch), -sin(pitch), -cos(yaw)*cos(pitch))
  // y "derecha" es (cos(yaw), -sin(yaw)) — el componente vertical de
  // "adelante" es lo que permite subir/bajar con ⬆️/⬇️ cuando la cámara
  // está inclinada hacia arriba o hacia abajo.
  const rightX=Math.cos(camYaw), rightZ=-Math.sin(camYaw);
  const cosP3=Math.cos(camPitch);
  const forwardX=-Math.sin(camYaw)*cosP3, forwardZ=-Math.cos(camYaw)*cosP3, forwardY=-Math.sin(camPitch);
  let targetVX=0,targetVZ=0,targetVY=0;
  if(keyState3D.ArrowLeft){targetVX-=rightX*moveSpeed;targetVZ-=rightZ*moveSpeed;}
  if(keyState3D.ArrowRight){targetVX+=rightX*moveSpeed;targetVZ+=rightZ*moveSpeed;}
  if(keyState3D.ArrowUp){targetVX+=forwardX*moveSpeed;targetVZ+=forwardZ*moveSpeed;targetVY+=forwardY*moveSpeed;}
  if(keyState3D.ArrowDown){targetVX-=forwardX*moveSpeed;targetVZ-=forwardZ*moveSpeed;targetVY-=forwardY*moveSpeed;}
  // La velocidad sigue a las flechas mientras están pulsadas. Al soltarlas,
  // se detiene inmediatamente: así la velocidad mostrada vuelve a 0 sin
  // dejar inercia acumulada.
  if(targetVX===0 && targetVY===0 && targetVZ===0){
    velX3D=0; velY3D=0; velZ3D=0;
    // Al soltar las flechas, la distancia se queda congelada durante 2 s.
    // Si se vuelve a mover antes, se cancela el reinicio. Después de 2 s,
    // el contador vuelve automáticamente a 0 para el siguiente trayecto.
    if(distanceTracking3D && distanceTravelledAU!==0 && distanceResetTimer3D===null){
      distanceResetTimer3D=setTimeout(()=>{
        distanceResetTimer3D=null;
        if(distanceTracking3D){
          distanceTravelledAU=0;
          refreshDistance3D();
        }
      },2000);
    }
  }else{
    if(distanceResetTimer3D!==null){
      clearTimeout(distanceResetTimer3D);
      distanceResetTimer3D=null;
    }
    velX3D += (targetVX-velX3D)*smoothing;
    velZ3D += (targetVZ-velZ3D)*smoothing;
    velY3D += (targetVY-velY3D)*smoothing;
  }
  camTargetX += velX3D*dt;
  camTargetZ += velZ3D*dt;
  camTargetY += velY3D*dt;
  // El sistema de Próxima se desbloquea al alcanzar 4,24 años luz del Sol.
  const distFromSunAU=Math.hypot(camTargetX,camTargetY,camTargetZ)/AU_UNIT;
  if(distanceTracking3D){
    distanceTravelledAU += Math.hypot(velX3D,velY3D,velZ3D)*dt/AU_UNIT;
  }

  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  // Cielo 3D: las estrellas y la Vía Láctea están en una esfera celeste muy
  // lejana. Solo dependen de la ORIENTACIÓN de la cámara (yaw/pitch), nunca
  // de su posición ni del zoom — así que en vez de recalcular miles de
  // puntos y decenas de degradados en cada uno de los ~60 fotogramas por
  // segundo, los pintamos en un canvas oculto (caché) y solo lo
  // recalculamos cuando la cámara gira de verdad, cambia el tamaño de
  // ventana, o cada ~110ms (para que las estrellas sigan centelleando sin
  // recalcular todo constantemente). El resto del tiempo solo copiamos esa
  // imagen ya hecha, que es prácticamente gratis.
  const focal=Math.min(W,H)*0.95;
  if(!skyCache){
    skyCache=document.createElement('canvas');
    skyCacheCtx=skyCache.getContext('2d');
  }
  const skyStale = skyCacheYaw===null || skyCacheW!==W || skyCacheH!==H ||
    Math.abs(skyCacheYaw-camYaw)>0.0025 || Math.abs(skyCachePitch-camPitch)>0.0025 ||
    (now-skyCacheTime)>250;
  if(skyStale){
    if(skyCache.width!==W||skyCache.height!==H){skyCache.width=W;skyCache.height=H;}
    renderSkyLayer(skyCacheCtx,camYaw,camPitch,W,H,focal,now*0.001);
    skyCacheYaw=camYaw;skyCachePitch=camPitch;skyCacheW=W;skyCacheH=H;skyCacheTime=now;
  }
  ctx.drawImage(skyCache,0,0);

  // 3D: distancias orbitales proporcionales a las reales.
  // 180 unidades = 1 UA. Esto evita que el Sol sea gigantesco respecto a Mercurio.
  const AU=180;
  const zNow=Math.max(.005,Number(document.getElementById('zoom').value));
  const cx=W/2,cy=H/2;
  const cosY=Math.cos(camYaw),sinY=Math.sin(camYaw),cosP=Math.cos(camPitch),sinP=Math.sin(camPitch);

  function project(vx,vy,vz){
    vx-=camTargetX; vy-=camTargetY; vz-=camTargetZ;
    let x=vx*cosY-vz*sinY;
    let z=vx*sinY+vz*cosY;
    let y=vy*cosP-z*sinP;
    z=vy*sinP+z*cosP;
    const depth=camDistance-z;
    const k=focal/Math.max(1e-12,depth); // sin suelo en 1: si no, por debajo de distancia 1 el zoom no cambia nada
    return {x:cx+x*k,y:cy-y*k,depth,k};
  }
  // Misma rotación que project() pero solo de orientación: sirve para saber
  // hacia dónde apunta un vector (p. ej. planeta→luna) en la vista actual.
  function camRot(vx,vy,vz){
    let x=vx*cosY-vz*sinY;
    let z=vx*sinY+vz*cosY;
    let y=vy*cosP-z*sinP;
    z=vy*sinP+z*cosP;
    return [x,y,z];
  }
  function orbitPoint(radius,angle,inc,node=0){
    // Órbita inclinada en 3D + pequeño nodo para que las órbitas no sean copias.
    let x=Math.cos(angle)*radius;
    let y=Math.sin(angle)*radius*Math.sin(inc);
    let z=Math.sin(angle)*radius*Math.cos(inc);
    const cn=Math.cos(node),sn=Math.sin(node);
    return [x*cn-z*sn,y,x*sn+z*cn];
  }

  const layout=[];
  starSystemHitboxes.length=0;
  drawInterstellarSystemMarkers(project);

  // Si se ha elegido un planeta desde "mostrar planetas", la cámara lo sigue.
  if(selectedMoon && selectedPlanet===selectedMoon.moon[0]){
    const mp3=moonWorldPos3D(selectedMoon.parent,selectedMoon.moon,selectedMoon.mi);
    camTargetX=mp3[0]; camTargetY=mp3[1]; camTargetZ=mp3[2];
  }else if(selectedPlanet){
    const targetBody=bodies.find(b=>b.name===selectedPlanet);
    if(targetBody){
      const ta=(simDays/targetBody.period)*Math.PI*2-1.1;
      const tp=orbitPoint(targetBody.a*AU,ta,targetBody.orbitInc||0,targetBody.orbitNode||0);
      camTargetX=tp[0]; camTargetY=tp[1]; camTargetZ=tp[2];
    }
  }

  for(const b of bodies){
    const angle=(simDays/b.period)*Math.PI*2-1.1;
    const inc=b.orbitInc||0;
    const pos=orbitPoint(b.a*AU,angle,inc,b.orbitNode||0);
    const pp=project(pos[0],pos[1],pos[2]);
    // Tamaños reales relativos: 1 radio terrestre = 0.12 unidades 3D.
    const radius=PLANET_REAL_RADIUS_EARTH[b.name]*AU*(6371/149597870.7)*pp.k;
    layout.push({body:b,angle,inc,pos,p:pp,radius,node:b.orbitNode||0});
  }

    // Órbitas 3D.
  if(!hideOrbits){
    for(const item of layout){
      ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.beginPath();
      for(let j=0;j<=220;j++){
        const a=j/220*Math.PI*2;
        const q=orbitPoint(item.body.a*AU,a,item.inc,item.node);
        const pp=project(q[0],q[1],q[2]);
        if(j===0)ctx.moveTo(pp.x,pp.y);else ctx.lineTo(pp.x,pp.y);
      }
      ctx.stroke();
    }
  }

  // Cinturón de asteroides, también en 3D.
  if(showAsteroids){
    const count=Math.min(2200,asteroids.length);
    for(let i=0;i<count;i++){
      const a=asteroids[i];
      const ang=a.angle0+(simDays/a.period)*Math.PI*2;
      const inc=((i%17)-8)*0.0022;
      const q=orbitPoint(a.r*AU,ang,inc,(i%31)*0.03);
      const pp=project(q[0],q[1],q[2]);
      if(pp.depth>0 && pp.depth<camDistance*2.1){
        const rr=pp.depth>camDistance?0.7:1.0;
        ctx.fillStyle='rgba(190,185,175,.75)';ctx.fillRect(pp.x,pp.y,rr,rr);
      }
    }
  }

  // Sol: tamaño real respecto a 1 UA, sin el estiramiento que causaba el Sol gigante.
  const sunP=project(0,0,0);
  const sunWorldRadius=SUN_REAL_RADIUS_EARTH*AU*(6371/149597870.7);
  const sr=Math.max(2.2,sunWorldRadius*sunP.k);
  shadeSphere3D(sunP.x,sunP.y,sr,'#ff9d00');
  drawSunSpots(sunP.x,sunP.y,sr);
  const glow=ctx.createRadialGradient(sunP.x,sunP.y,sr*.3,sunP.x,sunP.y,sr*2.2);
  glow.addColorStop(0,'rgba(255,190,70,.20)');glow.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sunP.x,sunP.y,sr*2.2,0,Math.PI*2);ctx.fill();

  // Limpiamos aquí los objetivos de clic de planetas. El sistema de Próxima
  // añadirá los suyos si estamos dentro de él.
  planetHitboxes.length=0;


  layout.sort((a,b)=>b.p.depth-a.p.depth);

  for(const item of layout){
    const b=item.body,p=item.p,r=item.radius;
    // OJO: antes había un "continue" aquí si el planeta quedaba detrás de la
    // cámara (p.depth<0), y eso saltaba TODO el resto del bloque, incluidas
    // las lunas. Al seguir una luna de cerca, camDistance se vuelve minúsculo
    // (estamos pegados a la luna, no al planeta), así que el planeta —a la
    // distancia real planeta-luna, mucho mayor que camDistance— cae fuera de
    // ese cálculo de profundidad y "parpadea" entre visible/invisible según
    // hacia dónde mires. Eso es lo que hacía que la luna seguida no
    // apareciera, o desapareciera al mover la cámara: sus lunas dependían de
    // que el planeta se considerara "visible", cuando en realidad la posición
    // de cada luna se calcula de forma independiente (ver más abajo, usa su
    // propia profundidad mp.depth). Ahora el planeta solo deja de dibujarse
    // A SÍ MISMO si está detrás de cámara; sus lunas siguen evaluándose y
    // dibujándose con su propia comprobación de profundidad.
    const planetVisible=p.depth>=0;
    if(planetVisible){
      planetHitboxes.push({name:b.name,x:p.x,y:p.y,radius:Math.max(6,r)});

      // Saturno: sistema de anillos con varias bandas, hueco de Cassini y
      // diferentes opacidades. Se dibuja antes de la esfera para que el planeta
      // tape la parte central de los anillos, como en una vista real.
      if(b.name==='Saturno'){
        ctx.save();ctx.translate(p.x,p.y);
        // La orientación de los anillos no depende directamente del movimiento
        // de la cámara. Se calcula a partir del plano real de los anillos de
        // Saturno y después se proyecta a pantalla. Así los anillos permanecen
        // unidos al planeta al girar/mover la vista, en vez de deslizarse.
        const satTilt=PLANET_ROTATION.Saturno.tilt*Math.PI/180;
        const satNode=NODE3.Saturno;
        const sn=Math.sin(satNode),cn=Math.cos(satNode);
        // Normal del plano ecuatorial de Saturno, aproximada con su inclinación
        // axial respecto al plano orbital y el nodo de su órbita.
        const axisWorld=[
          Math.sin(satTilt)*cn,
          Math.cos(satTilt),
          -Math.sin(satTilt)*sn
        ];
        const axisView=camRot(axisWorld[0],axisWorld[1],axisWorld[2]);
        const axisLen=Math.hypot(axisView[0],axisView[1],axisView[2])||1;
        const nx=axisView[0]/axisLen, ny=axisView[1]/axisLen, nz=axisView[2]/axisLen;
        const ringScale=Math.max(.10,Math.min(.98,Math.sqrt(nx*nx+ny*ny)));
        const ringAngle=Math.atan2(nx,-ny);
        ctx.rotate(ringAngle);
        const bands=[
          [1.10,1.22,'rgba(150,132,100,.30)'], // anillo C
          [1.24,1.50,'rgba(218,199,157,.62)'], // B interior
          [1.505,1.62,'rgba(92,82,68,.12)'],   // Cassini (hueco oscuro)
          [1.635,1.90,'rgba(225,207,165,.66)'], // B/A
          [1.91,2.18,'rgba(190,172,135,.52)'], // A
          [2.19,2.34,'rgba(125,113,91,.24)']   // borde exterior / F
        ];
        for(const [inner,outer,col] of bands){
          ctx.beginPath();
          ctx.ellipse(0,0,r*outer,r*outer*ringScale*.36,0,0,Math.PI*2);
          ctx.ellipse(0,0,r*inner,r*inner*ringScale*.36,0,0,Math.PI*2,true);
          ctx.closePath();
          ctx.fillStyle=col;ctx.fill('evenodd');
        }
        // Muchas líneas finas dan el aspecto estriado de partículas de hielo y roca.
        for(let i=0;i<34;i++){
          const rr=r*(1.12+i*(1.18/33));
          ctx.strokeStyle=i%5===0?'rgba(245,231,198,.32)':'rgba(175,157,121,.18)';
          ctx.lineWidth=Math.max(.45,r*.012);
          ctx.beginPath();ctx.ellipse(0,0,rr,rr*ringScale*.36,0,0,Math.PI*2);ctx.stroke();
        }
        // Cassini: separación claramente visible entre los anillos B y A.
        ctx.strokeStyle='rgba(35,32,28,.72)';ctx.lineWidth=Math.max(1,r*.035);
        ctx.beginPath();ctx.ellipse(0,0,r*1.57,r*1.57*ringScale*.36,0,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }

      { // el Sol está en el origen: dirección planeta→Sol, girada al espacio de la cámara
        let dx=-item.pos[0],dy=-item.pos[1],dz=-item.pos[2];const dl=Math.hypot(dx,dy,dz)||1;dx/=dl;dy/=dl;dz/=dl;
        const vx=dx*cosY-dz*sinY; let vz=dx*sinY+dz*cosY;
        const vy=dy*cosP-vz*sinP; vz=dy*sinP+vz*cosP;
        sunDirView3D=gameMode==='3d'?[vx,vy,vz]:null;
      }
      drawPlanetSphere(p.x,p.y,r,b,planetSpinAngle(b.name));
      if(showPlanetNames && (selectedPlanet || p.depth<camDistance*3.5 || gameMode==='3d')){
        ctx.fillStyle='#ddd';ctx.font='12px Arial';ctx.fillText(b.name,p.x+r+5,p.y-5);
      }
    }

    if(showMoons && b.moons.length && zNow>=.005){
      const moonInc=item.inc+.12;
      const maxMoon=Math.min(b.moons.length,b.name==='Júpiter'?8:b.name==='Saturno'?10:b.moons.length);
      // Botón "mostrar lunas": solo se dibujan las lunas importantes y con una
      // colocación esquemática alrededor del planeta (órbitas de tamaño fijo en
      // pantalla, con su nombre). A escala real una luna queda a menos de 1 px
      // de su planeta si estás lejos, y fuera de la pantalla si estás pegado a
      // él, por eso antes el botón parecía no hacer nada.
      const highlight=showImportantMoonsOnly;
      let rank=0; // posición entre las lunas resaltadas de este planeta
      // Nombres de lunas al estar en un planeta: solo las que orbitan a <= 1,5 millones de km.
      const nearPlanet=(selectedPlanet===b.name)||(selectedMoon&&selectedMoon.parent===b);
      const labelQueue=[];
      // Con el zoom alejado (cámara a más de ~3 veces el radio de 1,5 M km) no se muestran nombres de lunas.
      const zoomOK=camDistance<=3*(1500000/149597870.7)*AU;
      for(let mi=0;mi<maxMoon;mi++){
        const moon=b.moons[mi];
        if(highlight && !IMPORTANT_MOONS.has(moon[0])) continue;
        // Tamaños reales relativos, con un mínimo visual para que las lunas no desaparezcan.
        let mr=Math.max(0.55,(MOON_REAL_RADIUS_KM[moon[0]]||5)/149597870.7*AU*p.k);
        const orbitR=Math.max(b.a*0.0008*AU,(moon[1]*AU)*1.7);
        const ma=(simDays/moon[2])*Math.PI*2+mi*1.3;
        const q0=orbitPoint(orbitR,ma,moonInc,mi*.7); // relativo al planeta
        let mpx,mpy,visible=true,mdepthV=null;
        if(highlight){
          mr=Math.max(mr,2.8);
          // Radio de la órbita en pantalla: fuera del planeta (y de los anillos
          // de Saturno) y una órbita por encima de la anterior.
          const wantedPx=(b.name==='Saturno'?3.1:1.3)*r+16+rank*(12+r*0.25);
          const sc=wantedPx/orbitR;
          const c=camRot(q0[0],q0[1],q0[2]);
          mpx=p.x+c[0]*sc; mpy=p.y-c[1]*sc;
          // Una luna que pasa por detrás del planeta queda tapada por él.
          if(c[2]<0 && Math.hypot(mpx-p.x,mpy-p.y)<r) visible=false;
          if(!hideOrbits){
            ctx.strokeStyle='rgba(255,255,255,.22)';ctx.beginPath();
            for(let j=0;j<=70;j++){
              const aa=j/70*Math.PI*2;
              const qq=orbitPoint(orbitR,aa,moonInc,mi*.7);
              const cc=camRot(qq[0],qq[1],qq[2]);
              const ox=p.x+cc[0]*sc, oy=p.y-cc[1]*sc;
              if(j===0)ctx.moveTo(ox,oy);else ctx.lineTo(ox,oy);
            }
            ctx.stroke();
          }
          rank++;
        }else{
          q0[0]+=item.pos[0];q0[1]+=item.pos[1];q0[2]+=item.pos[2];
          const mp=project(q0[0],q0[1],q0[2]);
          mpx=mp.x;mpy=mp.y;visible=mp.depth>0;mdepthV=mp.depth;
          // El radio debe salir de la profundidad de LA LUNA, no la del planeta: si la
          // cámara está pegada a la luna, el planeta está mucho más lejos.
          mr=Math.max(0.55,(MOON_REAL_RADIUS_KM[moon[0]]||5)/149597870.7*AU*mp.k);
          if(!hideOrbits){
            ctx.strokeStyle='rgba(255,255,255,.10)';ctx.beginPath();
            for(let j=0;j<=70;j++){
              const aa=j/70*Math.PI*2;
              const qq=orbitPoint(orbitR,aa,moonInc,mi*.7);
              qq[0]+=item.pos[0];qq[1]+=item.pos[1];qq[2]+=item.pos[2];
              const pp=project(qq[0],qq[1],qq[2]);
              if(j===0)ctx.moveTo(pp.x,pp.y);else ctx.lineTo(pp.x,pp.y);
            }
            ctx.stroke();
          }
        }
        if(!visible) continue;
        drawMoonSphere(mpx,mpy,mr,moon[0],ma);
        if(showMoonNames){
          const inRange=moon[1]*149597870.7<=1500000; // distancia orbital real al planeta
          const isSel=selectedMoon&&selectedMoon.moon===moon;
          if(nearPlanet && !highlight){
            const behind=mdepthV!==null&&mdepthV>p.depth&&Math.hypot(mpx-p.x,mpy-p.y)<r;
            if(zoomOK && (inRange||isSel) && !behind && mpx>-60 && mpx<W+60 && mpy>-20 && mpy<H+20){
              labelQueue.push({name:moon[0],x:mpx+mr+6,y:mpy-4,rad:MOON_REAL_RADIUS_KM[moon[0]]||0,sel:!!isSel});
            }
          }else if(mr>2.0 || highlight){ctx.fillStyle='#bbb';ctx.font=(highlight?'10px':'9px')+' Arial';ctx.fillText(moon[0],mpx+mr+3,mpy-3);}
        }
      }
      // Nombres cerca de un planeta: primero los de las lunas más grandes. Si un nombre
      // chocaría con otro ya puesto se omite (no se apilan en columna).
      labelQueue.sort((u,v)=>(v.sel-u.sel)||(v.rad-u.rad));
      ctx.font='bold 13px Arial';ctx.lineJoin='round';ctx.lineWidth=3.5;
      const placedLabels=[];
      for(const q of labelQueue){
        const w=ctx.measureText(q.name).width;
        if(placedLabels.some(o=>q.x<o.x+o.w+8&&o.x<q.x+w+8&&Math.abs(q.y-o.y)<16)) continue;
        placedLabels.push({x:q.x,y:q.y,w});
        ctx.strokeStyle='rgba(0,0,0,.9)';ctx.strokeText(q.name,q.x,q.y);
        ctx.fillStyle='#fff';ctx.fillText(q.name,q.x,q.y);
      }
    }
  }

  const wholeDays=Math.floor(simDays),years=Math.floor(wholeDays/365),days=wholeDays%365;
  document.getElementById('time').innerHTML=`Tiempo: <b>${years} años, ${days} días</b>`;
  if(document.activeElement!==document.getElementById('speedLabel3D')){
    document.getElementById('speedLabel3D').value=formatSimSpeedNumber(simSpeed,speedTimeUnit);
  }
  const z=Number(document.getElementById('zoom').value);
  document.getElementById('zoomLabel').textContent=z<.001?z.toExponential(1)+'×':(z<.1?z.toFixed(3)+'×':(z<1?z.toFixed(2)+'×':(z<10?z.toFixed(1)+'×':Math.round(z)+'×')));

  // Velocidad de desplazamiento de la cámara (solo cuando se mueve con las
  // flechas), en la unidad que el usuario haya elegido en el desplegable.
  const camSpeedAU=Math.hypot(velX3D,velY3D,velZ3D)/AU;
  document.getElementById('speedBox3DValue').textContent=formatCamSpeed(camSpeedAU);
  refreshDistance3D();
}

function draw(){
 if(gameMode==='3d'){
   draw3D();
   requestAnimationFrame(draw);
   return;
 }
 const now=performance.now();
 const dt=(now-last)/1000;
 last=now;

 // Misma red de seguridad que en draw3D(): si panX/panY llegaran a
 // corromperse (NaN/Infinity), el zoom y el arrastre dejarían de tener
 // ningún efecto visible para siempre. Autocorregir en vez de quedarse así.
 if(!Number.isFinite(panX)||!Number.isFinite(panY)){
   panX=0;panY=0;
 }
 const simSpeed=Number(document.getElementById('speed').value);
 if(!paused) simDays += dt*simSpeed;

 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

 // Fixed star field
 let seed=12345;
 for(let i=0;i<220;i++){
   seed=(seed*1664525+1013904223)>>>0;
   const x=seed%W;
   seed=(seed*1664525+1013904223)>>>0;
   const y=seed%H;
   ctx.fillStyle=i%9===0?'#fff':'#777';
   ctx.fillRect(x,y,1,1);
 }

 const s=scale();
 const zNow=Number(document.getElementById('zoom').value);
 const sizeBoost=1+0.12*Math.sqrt(zNow);
 // En modo real, el radio del Sol escala de forma LINEAL con el zoom (sin
 // el "suelo" que tiene sizeBoost), para que de verdad se encoja al alejar
 // la cámara. Si no se encogiera, alejar el zoom nunca conseguiría separar
 // el sistema, por mucho que se estirasen las distancias.
 const EARTH_RADIUS_AU=6371/149597870.7;
 // En modo real mantenemos las proporciones físicas entre tamaños y
 // distancias: el radio del Sol/planetas se calcula en UA y luego se pasa
 // por la misma escala orbital. Así ningún planeta queda dentro del Sol.
 const sunRadius = gameMode==='normal' ? 20*sizeBoost : (realSizes ? Math.max(2.2,SUN_REAL_RADIUS_EARTH*EARTH_RADIUS_AU*s) : 40);

 // Con "Tamaños reales" activo, el Sol y los planetas se dibujan a su
 // tamaño real, que es enormemente mayor que la escala de distancias en
 // UA. En vez de forzar la separación planeta a planeta (lo que acababa
 // distorsionando las distancias relativas), calculamos UN único factor
 // de estiramiento uniforme: el mínimo necesario para que Mercurio quede
 // siempre claramente fuera del Sol. El margen es proporcional al radio
 // del Sol (no un número fijo de píxeles), así que tanto el radio del Sol
 // como el margen escalan igual que la distancia de Mercurio al cambiar
 // el zoom, y el factor resultante es una constante real: alejar el zoom
 // ahora sí encoge proporcionalmente todo el sistema (y acercar lo agranda).
 let realOrbitStretch=1;
 // No se estiran las órbitas: 1 UA conserva exactamente la misma escala
 // que las posiciones orbitales de los planetas. Los tamaños reales usan
 // esa misma escala física (radio terrestre -> UA).
 if(realSizes && gameMode!=='normal') realOrbitStretch=1;

 const orbitLayout=[];
 for(const b of bodies){
   const rocky=b.a<=1.524;
   let visualSize;
   if(realSizes && gameMode!=='normal'){
     // Mismo escalado LINEAL que el Sol (sin el "suelo" de sizeBoost), para
     // que las proporciones reales entre el Sol y los planetas se mantengan
     // en cualquier zoom (si no, a zoom bajo el Sol se encoge más rápido
     // que los planetas y estos acaban pareciendo más grandes que el Sol).
     const radiusEarth=(gameMode==='normal')?EQUAL_PLANET_RADIUS_EARTH:PLANET_REAL_RADIUS_EARTH[b.name];
     // Radio físico convertido a UA y dibujado con la misma escala que la órbita.
     // El mínimo evita que el planeta desaparezca por redondeo a píxeles.
     visualSize=Math.max(radiusEarth*EARTH_RADIUS_AU*s, 0.6);
   }else{
     const baseRadius=rocky?Math.max(b.size,5.5):b.size;
     visualSize=baseRadius*sizeBoost;
   }
   const orbitR=b.a*s*realOrbitStretch;
   orbitLayout.push({body:b,rocky,visualSize,orbitR});
 }
 const layoutByName={};
 for(const item of orbitLayout) layoutByName[item.body.name]=item;

 let followX=0,followY=0;
 if(selectedPlanet){
   const item=layoutByName[selectedPlanet];
   if(item){
     const fa=(simDays/item.body.period)*Math.PI*2-1.1;
     followX=-Math.cos(fa)*item.orbitR;
     followY=-Math.sin(fa)*item.orbitR;
   }
 }
 lastFollowX=followX; lastFollowY=followY;
 const cx=W/2+panX+followX;
 const cy=H/2+panY+followY;

 // Orbits remain proportionally scaled.
 if(!hideOrbits){
   for(const item of orbitLayout){
     ctx.strokeStyle='rgba(255,255,255,.17)';
     ctx.lineWidth=1;
     ctx.beginPath();
     ctx.arc(cx,cy,item.orbitR,0,Math.PI*2);
     ctx.stroke();
   }
 }

 // Cinturón de asteroides (se estira igual que los planetas para mantenerse
 // coherente entre Marte y Júpiter en modo "Tamaños reales", que además
 // muestra el doble de asteroides que el modo normal)
 if(showAsteroids){
   ctx.fillStyle='rgba(190,185,175,.85)';
   const asteroidDrawCount = (realSizes && gameMode!=='normal') ? asteroids.length : 1400;
   for(let i=0;i<asteroidDrawCount;i++){
     const ast=asteroids[i];
     const aAngle=ast.angle0+(simDays/ast.period)*Math.PI*2;
     const aR=ast.r*s*realOrbitStretch;
     const ax=cx+Math.cos(aAngle)*aR;
     const ay=cy+Math.sin(aAngle)*aR;
     ctx.fillRect(ax,ay,1.4,1.4);
   }
 }

 // Sun
 drawSun2D(cx,cy,sunRadius);
 drawSunSpots(cx,cy,sunRadius);

 planetHitboxes.length=0;
 for(const item of orbitLayout){
   const b=item.body;
   const angle=(simDays/b.period)*Math.PI*2-1.1;
   const x=cx+Math.cos(angle)*item.orbitR;
   const y=cy+Math.sin(angle)*item.orbitR;
   const rocky=item.rocky;
   const visualSize=item.visualSize;
   planetHitboxes.push({name:b.name,x,y,radius:visualSize});

   if(b.name==='Saturno'){
     // Anillos en varias capas: C, B, hueco de Cassini, A y borde exterior.
     // Las proporciones se mantienen al hacer zoom.
     const squish=0.40;
     ctx.save();ctx.translate(x,y);ctx.rotate(0.45);
     const bands=[
       [1.10,1.22,'rgba(150,132,100,.28)'],
       [1.24,1.50,'rgba(218,199,157,.58)'],
       [1.505,1.62,'rgba(70,62,50,.10)'],
       [1.635,1.90,'rgba(225,207,165,.63)'],
       [1.91,2.18,'rgba(190,172,135,.50)'],
       [2.19,2.34,'rgba(125,113,91,.22)']
     ];
     for(const [inner,outer,col] of bands){
       ctx.beginPath();
       ctx.ellipse(0,0,visualSize*outer,visualSize*outer*squish,0,0,Math.PI*2);
       ctx.ellipse(0,0,visualSize*inner,visualSize*inner*squish,0,0,Math.PI*2,true);
       ctx.closePath();ctx.fillStyle=col;ctx.fill('evenodd');
     }
     for(let i=0;i<28;i++){
       const rr=visualSize*(1.12+i*(1.18/27));
       ctx.strokeStyle=i%5===0?'rgba(245,231,198,.30)':'rgba(175,157,121,.16)';
       ctx.lineWidth=Math.max(.4,visualSize*.010);
       ctx.beginPath();ctx.ellipse(0,0,rr,rr*squish,0,0,Math.PI*2);ctx.stroke();
     }
     ctx.strokeStyle='rgba(35,32,28,.72)';ctx.lineWidth=Math.max(1,visualSize*.028);
     ctx.beginPath();ctx.ellipse(0,0,visualSize*1.57,visualSize*1.57*squish,0,0,Math.PI*2);ctx.stroke();
     ctx.restore();
   }

   if(rocky){
     ctx.fillStyle='rgba(255,255,255,.11)';
     ctx.beginPath();ctx.arc(x,y,visualSize+6,0,Math.PI*2);ctx.fill();
   }

   drawPlanetSphere(x,y,visualSize,b,planetSpinAngle(b.name));

   const namesHiddenForOverview = !realSizes && zNow<=0.1001;
   if(showPlanetNames && !namesHiddenForOverview){
     ctx.fillStyle='#ddd';
     ctx.font='12px Arial';
     ctx.fillText(b.name,x+8,y-7);
   }

   const moonZoomThreshold = gameMode==='normal' ? 50 : (realSizes ? 300 : 100);
   if(showMoons && zNow>=moonZoomThreshold && b.moons.length){
     // Borde de partida: el radio del planeta (o el de sus anillos, en el
     // caso de Saturno) más un margen. El margen es proporcional al tamaño
     // dibujado del planeta para que también escale con el zoom.
     let prevOuterEdge = b.name==='Saturno' ? visualSize*3.0 : visualSize*1.35+2;
     for(let mi=0;mi<b.moons.length;mi++){
       const moon=b.moons[mi]; // [nombre, distancia UA, período real en días]
       const moonKm=MOON_REAL_RADIUS_KM[moon[0]]||5;
       const moonDrawR = realSizes
         ? Math.max(moonKm/(PLANET_REAL_RADIUS_EARTH[b.name]*6371)*visualSize, 0.05)
         : Math.max(2,1.5);
       // El hueco entre lunas también escala con el tamaño que tienen
       // dibujado, para que nunca se toquen entre sí sea cual sea el zoom.
       const gap = moonDrawR*0.8+3;
       const naturalOrbit = moon[1]*s;
       const moonR = Math.max(naturalOrbit, prevOuterEdge+moonDrawR+gap);
       prevOuterEdge = moonR+moonDrawR;
       const ma=(simDays/moon[2])*Math.PI*2 + mi*1.3;
       const mx=x+Math.cos(ma)*moonR;
       const my=y+Math.sin(ma)*moonR;
       if(!hideOrbits){
         ctx.strokeStyle='rgba(255,255,255,.16)';
         ctx.beginPath();ctx.arc(x,y,moonR,0,Math.PI*2);ctx.stroke();
       }
       drawMoonSphere(mx,my,moonDrawR,moon[0],ma);
       if(showMoonNames){
         ctx.font='10px Arial';ctx.fillText(moon[0],mx+4,my-4);
       }
     }
   }
 }

 if(!realSizes && zNow<=0.1001){
   ctx.fillStyle='#ddd';
   ctx.font='12px Arial';
   ctx.fillText('Sistema Solar',cx+8,cy-7);
 }

 const wholeDays=Math.floor(simDays);
 const years=Math.floor(wholeDays/365);
 const days=wholeDays%365;
 document.getElementById('time').innerHTML=
   `Tiempo: <b>${years} años, ${days} días</b>`;
 document.getElementById('speedLabel').textContent=simSpeed+'×';
 const z=Number(document.getElementById('zoom').value);
 document.getElementById('zoomLabel').textContent=z<0.001?z.toExponential(1)+'×':(z<0.1?z.toFixed(3)+'×':(z<1?z.toFixed(2)+'×':(z<10?z.toFixed(1)+'×':Math.round(z)+'×')));

 requestAnimationFrame(draw);
}

// Mouse drag = camera movement, mouse click on a planet = follow it.
// Mientras el botón sigue pulsado (o se arrastra), la cámara sigue
// siguiendo al planeta. Solo un DOBLE clic deja de seguirlo.
let mouseDownPos=null;
canvas.addEventListener('mousedown',e=>{
 if(gameMode==='3d') return;
 dragging=true;lastX=e.clientX;lastY=e.clientY;
 mouseDownPos={x:e.clientX,y:e.clientY};
 canvas.classList.add('dragging');
});
addEventListener('mousemove',e=>{
 if(gameMode==='3d')return;
 if(!dragging)return;
 panX+=e.clientX-lastX;
 panY+=e.clientY-lastY;
 lastX=e.clientX;lastY=e.clientY;
});
addEventListener('mouseup',e=>{
 if(gameMode==='3d')return;
 dragging=false;canvas.classList.remove('dragging');
 if(mouseDownPos){
   const moved=Math.hypot(e.clientX-mouseDownPos.x,e.clientY-mouseDownPos.y);
   if(moved<5){
     // Clic sin arrastre: comprueba si cae sobre un planeta para seguirlo.
     // Si no cae sobre ninguno y ya se estaba siguiendo uno, se sigue igual.
     const rect=canvas.getBoundingClientRect();
     const mx=e.clientX-rect.left,my=e.clientY-rect.top;
     let hit=null;
     for(const p of planetHitboxes){
       if(Math.hypot(mx-p.x,my-p.y)<=p.radius+8){ hit=p; break; }
     }
     if(hit){
       selectedPlanet=hit.name;
       document.getElementById('zoom').value=zoomForPlanetSize(hit.name);
       panX=0;panY=0;
     }
   }
   // Un arrastre normal ya NO deja de seguir: solo desplaza la vista
   // (panX/panY) mientras la cámara sigue enganchada al planeta.
 }
 mouseDownPos=null;
});
canvas.addEventListener('dblclick',()=>{
 if(gameMode==='3d')return;
 if(selectedPlanet){
   // Doble clic: deja de seguir, congelando la cámara justo donde estaba
   // (sin saltar de vuelta al Sol).
   panX+=lastFollowX; panY+=lastFollowY;
   selectedPlanet=null;
 }
});

// Wheel = zoom
canvas.addEventListener('wheel',e=>{
 if(gameMode==='3d')return;
 e.preventDefault();
 const z=document.getElementById('zoom');
 const oldZ=Number(z.value);
 if(!Number.isFinite(oldZ))return; // valor inválido en el input: no tocar nada
 const factor=Math.exp(-Math.max(-200,Math.min(200,e.deltaY))*0.0015); // sensibilidad del zoom: 0.0015, un poco más rápida
 const minZoom = realSizes ? 0.005 : 0.1;
 const newZ=Math.max(minZoom,Math.min(gameMode==='normal'?1100:1000,oldZ*factor));

 // Zoom hacia el punto donde está el ratón, no hacia el Sol. Se tiene en
 // cuenta lastFollowX/Y (el desplazamiento automático que centra al planeta
 // seguido) porque si no, al seguir un planeta el centro real en pantalla
 // no coincide con el que asume esta fórmula y la vista "salta" o parece
 // congelada en vez de hacer zoom donde se espera.
 const rect=canvas.getBoundingClientRect();
 const mx=e.clientX-rect.left;
 const my=e.clientY-rect.top;
 const oldS=baseScale()*oldZ;
 const newS=baseScale()*newZ;
 if(!(oldS>0)){ z.value=newZ; return; } // canvas sin tamaño válido todavía: solo actualizar el número

 const worldX=(mx-W/2-panX-lastFollowX)/oldS;
 const worldY=(my-H/2-panY-lastFollowY)/oldS;
 const newPanX=mx-W/2-worldX*newS-lastFollowX;
 const newPanY=my-H/2-worldY*newS-lastFollowY;

 z.value=newZ;
 if(Number.isFinite(newPanX)&&Number.isFinite(newPanY)){
   panX=newPanX; panY=newPanY;
 }
},{passive:false});

// En modo 3D, el zoom usa una escala logarítmica para que todo el recorrido
// 0.005× → 500× sea realmente utilizable.
// Antes estas dos funciones asumían un rango de zoom (1e-12 a 1e12) que no
// coincidía con el rango REAL del slider (0.005 a 1000/1100). Al convertir
// una distancia de cámara a un valor de zoom, el resultado casi siempre caía
// fuera de ese rango y el navegador lo recortaba al mínimo o al máximo del
// slider: al alejar la cámara (zoom out) el número de zoom en pantalla se
// quedaba clavado en el mínimo y parecía que la rueda ya no hacía nada,
// aunque la cámara sí se estuviera alejando.
function zoomToCameraDistance(z){
  const el=document.getElementById('zoom');
  const zoomMin=Number(el.min)||0.005, zoomMax=Number(el.max)||1000;
  const nearD=5e-10, farD=5.2e11;
  const zz=Math.max(zoomMin,Math.min(zoomMax,Number(z)||zoomMin));
  const t=(Math.log(zoomMax)-Math.log(zz))/(Math.log(zoomMax)-Math.log(zoomMin));
  return nearD*Math.pow(farD/nearD,t);
}
function cameraDistanceToZoom(d){
  const el=document.getElementById('zoom');
  const zoomMin=Number(el.min)||0.005, zoomMax=Number(el.max)||1000;
  const nearD=5e-10, farD=5.2e11;
  const dd=Math.max(nearD,Math.min(farD,Number(d)||nearD));
  const t=Math.log(dd/nearD)/Math.log(farD/nearD);
  return Math.exp(Math.log(zoomMax)-t*(Math.log(zoomMax)-Math.log(zoomMin)));
}
document.getElementById('zoom').addEventListener('input',()=>{
  if(gameMode==='3d'){
    const raw=Number(document.getElementById('zoom').value);
    if(!Number.isFinite(raw))return;
    const d=zoomToCameraDistance(raw);
    if(Number.isFinite(d)) camDistance=d;
  }
});

// Planet selection menu.
const planetButton=document.getElementById('planetButton');

function focusPlanetFromMenu(body){
  if(!body) return;
  planetList.style.display='none';
  selectedMoon=null;
  selectedPlanet=body.name;
  panX=0;
  panY=0;

  if(gameMode==='3d'){
    // Primero colocamos la cámara en la posición actual del planeta.
    const AU3=180;
    const aa=(simDays/body.period)*Math.PI*2-1.1;
    let xx=Math.cos(aa)*body.a*AU3;
    let yy=Math.sin(aa)*body.a*AU3*Math.sin(body.orbitInc||0);
    let zz=Math.sin(aa)*body.a*AU3*Math.cos(body.orbitInc||0);
    const nn=body.orbitNode||0,cc=Math.cos(nn),ss=Math.sin(nn);
    camTargetX=xx*cc-zz*ss;
    camTargetY=yy;
    camTargetZ=xx*ss+zz*cc;

    // Distancia para que el planeta ocupe aproximadamente 1/3 de la pantalla.
    const radius3=Math.max(0.0005,(PLANET_REAL_RADIUS_EARTH[body.name]||1)*AU3*(6371/149597870.7));
    const focal3=Math.min(W,H)*0.95;
    const desiredRadiusPx=Math.min(W,H)/6;
    camDistance=Math.max(5e-10,focal3*radius3/desiredRadiusPx);
    document.getElementById('zoom').value=cameraDistanceToZoom(camDistance);
  }else{
    document.getElementById('zoom').value=zoomForPlanetSize(body.name);
  }
}

function showModeLoading(title, callback){
  const loadingScreen=document.getElementById('loadingScreen');
  const loadingBarFill=document.getElementById('loadingBarFill');
  const loadingPercent=document.getElementById('loadingPercent');
  const loadingTitle=loadingScreen.querySelector('.loadingTitle');
  loadingTitle.textContent=title;
  loadingBarFill.style.width='0%';loadingPercent.textContent='0%';
  loadingScreen.classList.add('active');
  const duration=2000,start=performance.now();
  function step(now){
    const progress=Math.min(1,(now-start)/duration);
    loadingBarFill.style.width=(progress*100).toFixed(0)+'%';
    loadingPercent.textContent=(progress*100).toFixed(0)+'%';
    if(progress<1) requestAnimationFrame(step);
    else { callback(); loadingScreen.classList.remove('active'); last=performance.now(); }
  }
  requestAnimationFrame(step);
}

// Controles específicos del modo 3D.
canvas.addEventListener('mousedown',e=>{
  if(gameMode!=='3d')return;
  last3DX=e.clientX;last3DY=e.clientY;
  if(e.button===2||e.shiftKey) planetDrag3D=true; else mouse3D=true;
});
canvas.addEventListener('contextmenu',e=>{ if(gameMode==='3d') e.preventDefault(); });
addEventListener('mousemove',e=>{
  if(gameMode!=='3d')return;
  if(planetDrag3D){
    if(selectedPlanet){
      const ur=userRot[selectedPlanet]||(userRot[selectedPlanet]={lon:0,lat:0});
      ur.lon+=(e.clientX-last3DX)*.01;
      ur.lat=Math.max(-1.45,Math.min(1.45,ur.lat+(e.clientY-last3DY)*.008));
    }
    last3DX=e.clientX;last3DY=e.clientY;
    return;
  }
  if(!mouse3D)return;
  const oldYaw=camYaw,oldPitch=camPitch;
  camYaw+=(e.clientX-last3DX)*.008;
  camPitch+=(e.clientY-last3DY)*.006;
  camPitch=Math.max(-1.35,Math.min(1.35,camPitch));
  if(!selectedPlanet){
    // Sin planeta ni luna seguidos, la cámara gira sobre sí misma en vez de
    // orbitar el punto de mira: se compensa el objetivo para que su posición
    // no cambie (posición = objetivo + camDistance*(cosP·sinY, sinP, cosP·cosY)).
    const c0=Math.cos(oldPitch),c1=Math.cos(camPitch);
    camTargetX+=camDistance*(c0*Math.sin(oldYaw)-c1*Math.sin(camYaw));
    camTargetY+=camDistance*(Math.sin(oldPitch)-Math.sin(camPitch));
    camTargetZ+=camDistance*(c0*Math.cos(oldYaw)-c1*Math.cos(camYaw));
  }
  last3DX=e.clientX;last3DY=e.clientY;
});
let down3D=null;
canvas.addEventListener('mousedown',e=>{down3D={x:e.clientX,y:e.clientY,b:e.button,s:e.shiftKey};});
addEventListener('mouseup',e=>{
  const wasOrbit=mouse3D;
  mouse3D=false;planetDrag3D=false;
  // Clic simple (sin arrastrar) sobre un planeta: lo selecciona como desde el menú.
  if(gameMode==='3d'&&wasOrbit&&down3D&&down3D.b===0&&!down3D.s&&e.target===canvas&&Math.hypot(e.clientX-down3D.x,e.clientY-down3D.y)<5){
    const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    let systemBest=null,sd=1e9;
    for(const h of starSystemHitboxes){const d=Math.hypot(mx-h.x,my-h.y);if(d<=h.radius&&d<sd){sd=d;systemBest=h;}}
    if(systemBest){
      if(systemBest.id==='sun') setCameraToSun();
      return;
    }
    let best=null,bd=1e9;
    for(const h of planetHitboxes){const d=Math.hypot(mx-h.x,my-h.y);if(d<=h.radius+4&&d<bd){bd=d;best=h;}}
    if(best){const it=[...planetList.children].find(c=>c.textContent===best.name);if(it)it.onclick();}
  }
});

canvas.addEventListener('wheel',e=>{
  if(gameMode!=='3d')return;
  e.preventDefault();
  if(!Number.isFinite(camDistance)||camDistance<=0) camDistance=650;

  // Zoom 3D centrado EXACTAMENTE en la posición del ratón.
  // Calculamos el rayo que sale de la cámara pasando por el píxel bajo el
  // cursor y desplazamos cámara + objetivo a lo largo de ese rayo. Así el
  // punto que tienes bajo el ratón permanece bajo el ratón al acercar/alejar.
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left-W/2;
  const my=e.clientY-rect.top-H/2;
  const focal=Math.min(W,H)*0.95;
  let rx=mx/Math.max(1,focal);
  let ry=-my/Math.max(1,focal);
  let rz=-1;
  const rlen=Math.hypot(rx,ry,rz)||1; rx/=rlen; ry/=rlen; rz/=rlen;
  // Inversa de la rotación yaw -> pitch usada por project().
  const y1=ry*Math.cos(camPitch)+rz*Math.sin(camPitch);
  const z1=-ry*Math.sin(camPitch)+rz*Math.cos(camPitch);
  const rayX=rx*Math.cos(camYaw)+z1*Math.sin(camYaw);
  const rayY=y1;
  const rayZ=-rx*Math.sin(camYaw)+z1*Math.cos(camYaw);

  const factor=Math.exp(-Math.max(-200,Math.min(200,e.deltaY))*0.0015);
  const oldD=camDistance;
  const newD=Math.max(5e-10,Math.min(5.2e11,oldD/factor));
  const move=oldD-newD;
  camTargetX+=rayX*move;
  camTargetY+=rayY*move;
  camTargetZ+=rayZ*move;
  camDistance=newD;
  document.getElementById('zoom').value=cameraDistanceToZoom(camDistance);
},{passive:false});

// Comandos de admin.
//
// Sintaxis disponible:
// /velocidad NUMERO              -> velocidad de las flechas en UA/s
// /planeta NOMBRE                -> centra y sigue ese planeta
// /cambiar orbita P1-P2          -> intercambia las órbitas de dos planetas
// /simulacion 1|2|3              -> 1 normal, 2 real, 3 3D
// /parar velocidad               -> anula /velocidad y vuelve a la velocidad normal
// /comandos                      -> muestra esta lista
function findBodyAdmin(name){
  const wanted=String(name||'').trim().toLocaleLowerCase('es');
  return bodies.find(b=>b.name.toLocaleLowerCase('es')===wanted);
}

function focusPlanetAdmin(name){
  const body=findBodyAdmin(name);
  if(!body) return `Planeta no encontrado: ${name}`;
  // Reutiliza exactamente la acción del botón "mostrar planetas", para que
  // el comando y el menú tengan el mismo comportamiento en 2D y en 3D.
  const btn=[...planetList.querySelectorAll('button')].find(x=>x.textContent.toLocaleLowerCase('es')===body.name.toLocaleLowerCase('es'));
  selectedMoon=null;
  if(btn){ btn.click(); }
  else { selectedPlanet=body.name; }
  return `Planeta seleccionado: ${body.name}`;
}

function changeOrbitAdmin(aName,bName){
  const a=findBodyAdmin(aName), b=findBodyAdmin(bName);
  if(!a || !b) return 'Uso: /cambiar orbita Planeta1-Planeta2';
  if(a===b) return 'Debes indicar dos planetas diferentes.';

  // IMPORTANTE: las órbitas son "ranuras" fijas. Al cambiar dos planetas
  // solo intercambiamos el planeta y TODAS sus lunas entre esas ranuras.
  // La distancia, el periodo, la inclinación y el nodo de cada órbita NO
  // cambian. Así los gráficos/líneas de las órbitas permanecen exactamente
  // en el mismo sitio y con la misma inclinación.
  const identityKeys=['name','color','size','moons'];
  const tmp={};
  for(const k of identityKeys) tmp[k]=a[k];
  for(const k of identityKeys) a[k]=b[k];
  for(const k of identityKeys) b[k]=tmp[k];

  selectedMoon=null;
  return `Planetas cambiados: ${a.name} ocupa ahora la órbita que tenía ${b.name} y ${b.name} la que tenía ${a.name}. Sus lunas se han movido con cada planeta. Las órbitas no han cambiado.`;
}

  showModeLoading(title,()=>applyMode(target));

}

const COMMANDS={
  velocidad:{
    desc:'/velocidad (numero) — velocidad de las flechas en UA/s',
    run:args=>{
      if(args.length!==1 || !/^[-+]?(?:\d+(?:[.,]\d*)?|[.,]\d+)(?:e[-+]?\d+)?$/i.test(args[0])){
        return 'Uso: /velocidad NUMERO (UA/s)';
      }
      const value=Number(args[0].replace(',','.'));
      if(!Number.isFinite(value) || value<0){
        return 'La velocidad debe ser un número mayor o igual que 0.';
      }
      adminArrowSpeedAU=value;
      return `Velocidad de las flechas: ${value} UA/s`;
    }
  },

  planeta:{
    desc:'/planeta (nombre) — va al planeta indicado',
    run:args=>focusPlanetAdmin(args.join(' '))
  },

  parar:{
    desc:'/parar velocidad — anula /velocidad y vuelve a la velocidad normal',
    run:args=>{
      if(args.length!==1 || args[0].toLocaleLowerCase('es')!=='velocidad'){
        return 'Uso: /parar velocidad';
      }
      adminArrowSpeedAU=null;
      return 'Comando /velocidad anulado. Se ha restaurado la velocidad normal de las flechas.';
    }
  },

  cambiar:{
    desc:'/cambiar orbita (planeta1)-(planeta2) — intercambia sus órbitas',
    run:args=>{
      const raw=args.join(' ').trim();
      const m=raw.match(/^orbita\s+(.+?)\s*-\s*(.+)$/i);
      if(!m) return 'Uso: /cambiar orbita Planeta1-Planeta2';
      return changeOrbitAdmin(m[1].trim(),m[2].trim());
    }
  },

  simulacion:{
    desc:'/simulacion (numero) — 1 normal, 2 real, 3 modo 3D',
    run:args=>setSimulationModeAdmin(args[0])
  },

  comandos:{
    desc:'/comandos — lista de comandos preparados',
    run:()=>Object.values(COMMANDS).map(c=>c.desc).join('\n')
  }
};
function runCommand(txt){
  const parts=txt.trim().replace(/^\//,'').split(/\s+/);
  const c=COMMANDS[parts[0].toLowerCase()];
  adminPrint('> '+txt.trim());
  adminPrint(c?String(c.run(parts.slice(1))):'Comando desconocido');
}

    v:1,

    zoom:document.getElementById('zoom').value,

function saveGameToStorage(){
  const name=window.prompt('Nombre para esta partida:','');
  if(name===null) return; // cancelado
  const trimmed=name.trim();
  if(!trimmed){ showSaveMsg('Debes indicar un nombre para guardar.'); return; }
  try{
    localStorage.setItem(SAVE_KEY_PREFIX+trimmed,JSON.stringify(collectSaveState()));
    showSaveMsg('Partida "'+trimmed+'" guardada ✔');
  }catch(err){
    showSaveMsg('No se pudo guardar la partida.');
  }
}

function applySaveState(s){
  if(!s || typeof s!=='object') return false;

  // Cuerpos (nombre/color/tamaño/lunas): por si se intercambiaron órbitas.
  if(Array.isArray(s.bodies)){
    s.bodies.forEach((sb,i)=>{
      if(bodies[i] && sb){
        bodies[i].name=sb.name;
        bodies[i].color=sb.color;
        bodies[i].size=sb.size;
        bodies[i].moons=sb.moons;
      }
    });
    const planetItems=[...planetList.querySelectorAll('button[data-planet]')];
    bodies.forEach((b,i)=>{
      if(planetItems[i]){ planetItems[i].textContent=b.name; planetItems[i].dataset.planet=b.name; }
    });
  }

  // Aplicar primero el modo de juego: coloca las clases CSS y los rangos
  // de los controles (zoom/velocidad) correctos, aunque también reinicia
  // cámara/zoom/selección a valores por defecto, que sobrescribimos justo
  // después con los valores guardados.
  applyMode(s.gameMode||'normal');

  simDays=Number(s.simDays)||0;
  paused=!!s.paused;
  document.getElementById('pause').textContent=paused?'▶ Reanudar':'⏸ Pausar';
  panX=Number(s.panX)||0;
  panY=Number(s.panY)||0;
  selectedPlanet=s.selectedPlanet||null;
  if(s.zoom!==undefined) document.getElementById('zoom').value=s.zoom;
  if(s.speed!==undefined) document.getElementById('speed').value=s.speed;

  showPlanetNames=s.showPlanetNames!==false;
  showMoonNames=s.showMoonNames!==false;
  hideOrbits=!!s.hideOrbits;
  showAsteroids=s.showAsteroids!==false;
  showMoons=s.showMoons!==false;
  showImportantMoonsOnly=!!s.showImportantMoonsOnly;
  document.getElementById('togglePlanetNames').checked=showPlanetNames;
  document.getElementById('toggleMoonNames').checked=showMoonNames;
  document.getElementById('toggleMoons').checked=showMoons;
  document.getElementById('toggleOrbits').checked=hideOrbits;
  document.getElementById('toggleAsteroids').checked=showAsteroids;
  document.getElementById('moonButton').classList.toggle('on',showImportantMoonsOnly);

  distanceTracking3D=!!s.distanceTracking3D;
  distanceUnit3D=s.distanceUnit3D||'au';
  distanceTravelledAU=Number(s.distanceTravelledAU)||0;
  document.getElementById('toggleDistance3D').checked=distanceTracking3D;
  document.getElementById('distanceRow3D').classList.toggle('active',gameMode==='3d' && distanceTracking3D);

  if(Number.isFinite(s.camYaw)) camYaw=s.camYaw;
  if(Number.isFinite(s.camPitch)) camPitch=s.camPitch;
  if(Number.isFinite(s.camDistance)) camDistance=s.camDistance;
  if(Number.isFinite(s.camRoll)) camRoll=s.camRoll;
  camTargetX=Number(s.camTargetX)||0;
  camTargetY=Number(s.camTargetY)||0;
  camTargetZ=Number(s.camTargetZ)||0;

  speedTimeUnit=s.speedTimeUnit||speedTimeUnit;
  if(Number.isFinite(s.simSpeed3D)) simSpeed3D=s.simSpeed3D;
  speedUnit=s.speedUnit||speedUnit;
  moveSpeedLevel=Number(s.moveSpeedLevel)||1;
  adminArrowSpeedAU=(s.adminArrowSpeedAU===null||s.adminArrowSpeedAU===undefined)?null:Number(s.adminArrowSpeedAU);
  creadorActivo=!!s.creadorActivo;
  if(creadorActivo){ adminBtn.style.display='flex'; positionAdminBtn(); }

  refreshDistance3D();
  refreshSpeedUnitToggleText();
  refreshSpeedLabel3D();
  last=performance.now();
  return true;
}

function loadGameFromStorage(){
  const name=window.prompt('Nombre de la partida a cargar:','');
  if(name===null) return; // cancelado
  const trimmed=name.trim();
  if(!trimmed){ showSaveMsg('Debes indicar un nombre para cargar.'); return; }
  let raw;
  try{ raw=localStorage.getItem(SAVE_KEY_PREFIX+trimmed); }catch(err){ raw=null; }
  if(!raw){ showSaveMsg('No existe ninguna partida con ese nombre.'); return; }
  let state=null;
  try{ state=JSON.parse(raw); }catch(err){ state=null; }
  if(!state){ showSaveMsg('La partida guardada está dañada.'); return; }
  const ok=applySaveState(state);
  showSaveMsg(ok?('Partida "'+trimmed+'" cargada ✔'):'No se pudo cargar la partida.');
}

document.getElementById('saveGame').onclick=saveGameToStorage;
document.getElementById('loadGame').onclick=loadGameFromStorage;

requestAnimationFrame(draw);
</script>
